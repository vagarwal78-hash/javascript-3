<html>
    <body>
        <h2>JavaScript String Methods</h2>
        <p>Basic methods</p>
        <script>
            var str = "AmAzInG";
            document.write(str.toUpperCase())
            document.write("<br>");
            document.write(str.toLowerCase());
            document.write("<br>")
            document.write(str.startsWith('i'));
            document.write("<br>");
            var str1 = "Coding is fun";
            var patt = new RegExp("fun");
            var res = patt.test(str1);
            document.write(res);
        

        </script>
    </body>
</html>
