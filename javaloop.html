<html>
    <head></head>
    <body>
        <h1>Loops</h1>

        <script>
            var fruits=['apple','mango','banana','grapes', 'kiwi', 'orange'];
            var i; 
            for(i=0; i<fruits.length; i++){
                document.write(fruits[i]);
                document.write("<br>");
            }
        </script>
    
    </body>
</html>
